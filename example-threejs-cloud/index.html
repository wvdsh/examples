<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>example-threejs-cloud</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
      #wavedash-target { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      .ui { position: absolute; pointer-events: none; }
      .ui > * { pointer-events: auto; }

      .panels { display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 32px); }
      .panels.top { top: 16px; }
      .panels.bottom { bottom: 16px; }
      .panels.left { left: 16px; width: 240px; }
      .panels.right { right: 16px; width: 300px; }
      .panels.bottom.left { width: 260px; }
      .panel { background: rgba(15,23,42,0.82); border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
      .panel-label { color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

      .palette { bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(15,23,42,0.75); padding: 8px; border-radius: 10px; border: 1px solid #334155; }

      .btn { background: #1e293b; color: #f1f5f9; border: 1px solid #334155; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
      .btn:hover { background: #334155; }
      .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
      .btn.primary { background: #2563eb; border-color: #3b82f6; }
      .btn.primary:hover { background: #3b82f6; }
      .btn.danger { background: #7f1d1d; border-color: #b91c1c; }
      .btn.danger:hover { background: #991b1b; }
      .btn.shape { width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-size: 20px; }
      .btn.shape.active { background: #2563eb; border-color: #60a5fa; }

      .wd-input { background: #0f172a; color: #f1f5f9; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; font-size: 13px; font-family: ui-monospace, SFMono-Regular, monospace; flex: 1; min-width: 0; }
      .wd-input:focus { outline: 1px solid #3b82f6; }

      .status { color: #cbd5e1; font-size: 12px; line-height: 1.4; white-space: pre-wrap; }
      .status.err { color: #fca5a5; }
      .status:empty { display: none; }

      .corner-br { position: absolute; bottom: 16px; right: 16px; }

      code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; color: #e2e8f0; background: #1e293b; padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <canvas id="wavedash-target"></canvas>

    <div class="ui panels top left">
      <div class="panel">
        <div class="panel-label">Save file · userfs</div>
        <div class="row">
          <button class="btn primary" id="save-btn">Save</button>
          <button class="btn" id="load-btn">Load</button>
          <button class="btn danger" id="delete-btn">Delete</button>
        </div>
        <div class="status" id="save-status"></div>
      </div>
    </div>

    <div class="ui panels top right">
      <div class="panel">
        <div class="panel-label">Publish · UGC</div>
        <div class="row">
          <button class="btn primary" id="publish-btn">Publish</button>
          <button class="btn" id="update-publish-btn" hidden>Update</button>
          <button class="btn" id="copy-ugc-id-btn" hidden>Copy ID</button>
          <button class="btn danger" id="unpublish-btn" hidden>Unpublish</button>
        </div>
        <div class="status" id="publish-status"></div>
      </div>
    </div>

    <div class="ui panels bottom left">
      <div class="panel">
        <div class="panel-label">Import shared scene · UGC</div>
        <div class="row">
          <input type="text" class="wd-input" id="import-ugc-id" placeholder="Paste a UGC ID" />
          <button class="btn" id="import-btn">Import</button>
        </div>
        <div class="status" id="import-status"></div>
      </div>
    </div>

    <div class="ui palette" id="palette"></div>
    <div class="ui corner-br">
      <button class="btn shape danger" id="clear-btn" title="Clear scene" aria-label="Clear scene">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M10 2a1 1 0 0 0-1 1v1H5a1 1 0 1 0 0 2h14a1 1 0 1 0 0-2h-4V3a1 1 0 0 0-1-1h-4zM7 8a1 1 0 0 0-1 1.08l1 12A1 1 0 0 0 8 22h8a1 1 0 0 0 1-.92l1-12A1 1 0 0 0 17 8H7z"/>
        </svg>
      </button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
