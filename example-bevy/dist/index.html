<script type="module">
import init, * as bindings from './pong-72d00c459c86fd57.js';

const sdk = await window.WavedashJS;
sdk.updateLoadProgressZeroToOne(0);

// Stream the .wasm download so the SDK loading bar reflects real bytes
// (wasm-bindgen's init() accepts a buffer in place of a URL).
const response = await fetch('./pong-72d00c459c86fd57_bg.wasm');
const total = +response.headers.get('Content-Length') || 0;
let wasmBytes;
if (!total || !response.body) {
  wasmBytes = new Uint8Array(await response.arrayBuffer());
} else {
  const reader = response.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    sdk.updateLoadProgressZeroToOne((received / total) * 0.95);
  }
  wasmBytes = new Uint8Array(received);
  let pos = 0;
  for (const c of chunks) { wasmBytes.set(c, pos); pos += c.length; }
}
sdk.updateLoadProgressZeroToOne(0.95);

const wasm = await init({ module_or_path: wasmBytes });
sdk.updateLoadProgressZeroToOne(0.99);


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
