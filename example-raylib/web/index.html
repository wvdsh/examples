<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>example-raylib</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas#canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script type="module">
      // Resolve the Wavedash SDK Promise before loading the game so the
      // EM_JS bridge can call WavedashJS.init() synchronously.
      const sdk = window.WavedashJS = await window.WavedashJS;
      // raylib's Emscripten port reads Module.canvas during GL init, so
      // this has to be set before game.js starts executing.
      window.Module = {
        canvas: document.getElementById("canvas"),
        instantiateWasm: async (imports, successCallback) => {
          sdk.updateLoadProgressZeroToOne(0);
          const response = await fetch("./game.wasm");
          const total = +response.headers.get("Content-Length") || 0;
          const reader = response.body && total ? response.body.getReader() : null;
          let bytes;
          if (!reader) {
            bytes = new Uint8Array(await response.arrayBuffer());
          } else {
            const chunks = [];
            let received = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              received += value.length;
              sdk.updateLoadProgressZeroToOne((received / total) * 0.95);
            }
            bytes = new Uint8Array(received);
            let pos = 0;
            for (const c of chunks) { bytes.set(c, pos); pos += c.length; }
          }
          sdk.updateLoadProgressZeroToOne(0.95);
          const { instance } = await WebAssembly.instantiate(bytes, imports);
          successCallback(instance);
          return {};
        },
      };
      const s = document.createElement("script");
      s.src = "./game.js";
      document.body.appendChild(s);
    </script>
  </body>
</html>
