<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>example-raylib</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas#canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script type="module">
      // Resolve the Wavedash SDK Promise before loading the game so the
      // EM_JS bridge can call WavedashJS.init() synchronously.
      window.WavedashJS = await window.WavedashJS;
      // raylib's Emscripten port reads Module.canvas during GL init, so
      // this has to be set before game.js starts executing.
      window.Module = { canvas: document.getElementById("canvas") };
      const s = document.createElement("script");
      s.src = "./game.js";
      document.body.appendChild(s);
    </script>
  </body>
</html>
