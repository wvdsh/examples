<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Untitled</title>
    <meta name="author" content="erik" />
    <style type="text/css"> body { background-color:#202850; }</style>
    <script type="module">
  // Stream binjgb.wasm + the GB rom through the SDK loading bar.
  let _wdSdk = null;
  Promise.resolve(window.WavedashJS).then((sdk) => { _wdSdk = sdk; });

  const KNOWN = ["binjgb.wasm", ".gb"];
  const totals = {};
  const received = {};
  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init) => {
    const url = typeof input === "string" ? input : (input && input.url) || "";
    const matched = KNOWN.find((k) => url.endsWith(k));
    const response = await realFetch(input, init);
    if (!matched || !response.body) return response;
    const total = +response.headers.get("Content-Length") || 0;
    if (!total) return response;
    totals[matched] = total;
    received[matched] = 0;
    const reader = response.body.getReader();
    const stream = new ReadableStream({
      async pull(controller) {
        const { done, value } = await reader.read();
        if (done) { controller.close(); return; }
        received[matched] += value.length;
        const totalAll = Object.values(totals).reduce((a, b) => a + b, 0);
        const recvAll = Object.values(received).reduce((a, b) => a + b, 0);
        if (_wdSdk && totalAll) _wdSdk.updateLoadProgressZeroToOne(Math.min(0.95, recvAll / totalAll));
        controller.enqueue(value);
      },
      cancel(reason) { return reader.cancel(reason); },
    });
    return new Response(stream, {
      status: response.status,
      statusText: response.statusText,
      headers: response.headers,
    });
  };

  (async () => {
    try {
      const WavedashJS = await window.WavedashJS;
      // Settle the bar at 1.0 once binjgb has had time to fetch both files.
      setTimeout(() => {
        WavedashJS.updateLoadProgressZeroToOne(1.0);
        WavedashJS.init({ debug: true });
      }, 400);
    } catch (e) { console.warn("[wavedash] init failed:", e); }
  })();
</script>
  </head>
  <body>
    <div id="game">
      <canvas id="mainCanvas" width="256" height="224">No Canvas Support</canvas>
    </div>
    <div id="controller">
      <div id="controller_dpad">
        <div id="controller_left"></div>
        <div id="controller_right"></div>
        <div id="controller_up"></div>
        <div id="controller_down"></div>
      </div>
      <div id="controller_select" class="capsuleBtn">Select</div>
      <div id="controller_start" class="capsuleBtn">Start</div>
      <div id="controller_b" class="roundBtn">B</div>
      <div id="controller_a" class="roundBtn">A</div>
    </div>      
    <script>
      const customControls = {"up":["ArrowUp","w"],"down":["ArrowDown","s"],"left":["ArrowLeft","a"],"right":["ArrowRight","d"],"a":["Alt","z","j"],"b":["Control","k","x"],"start":["Enter"],"select":["Shift"]}
    </script>
    <script src="binjgb.js"></script>
    <script src="js/script.js"></script>
    <script src="js/debugger.js"></script>
</body>
