<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Swift Pong</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0a0a0a;
            overflow: hidden;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
            background: #0a0a0a;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas" width="900" height="600"></canvas>
    <script type="importmap">
    {
      "imports": {
        "@bjorn3/browser_wasi_shim": "https://cdn.jsdelivr.net/npm/@bjorn3/browser_wasi_shim@0.3.0/+esm"
      }
    }
    </script>
    <script type="module">
      import { init } from "./index.js";
      // Resolve the Wavedash SDK promise in JS so Swift can treat WavedashJS as the raw SDK.
      window.WavedashJS = await window.WavedashJS;
      await init();
    </script>
</body>
</html>
