<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>example-ebiten</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <script src="./wasm_exec.js"></script>
    <script type="module">
      window.WavedashJS = await window.WavedashJS;
      const go = new Go();
      const result = await WebAssembly.instantiateStreaming(fetch("./game.wasm"), go.importObject);
      go.run(result.instance);
    </script>
  </body>
</html>
