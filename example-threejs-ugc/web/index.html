<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>example-threejs-ugc</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
      #wavedash-target { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      .ui { position: absolute; pointer-events: none; }
      .ui > * { pointer-events: auto; }
      .top { top: 16px; left: 16px; right: 16px; display: flex; gap: 8px; align-items: center; }
      .palette { bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(15,23,42,0.75); padding: 8px; border-radius: 10px; border: 1px solid #334155; }
      .btn { background: #1e293b; color: #f1f5f9; border: 1px solid #334155; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
      .btn:hover { background: #334155; }
      .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
      .btn.primary { background: #2563eb; border-color: #3b82f6; }
      .btn.primary:hover { background: #3b82f6; }
      .btn.shape { width: 48px; height: 48px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; }
      .btn.shape.active { background: #2563eb; border-color: #60a5fa; }
      .status { color: #cbd5e1; font-size: 13px; margin-left: auto; background: rgba(15,23,42,0.75); padding: 6px 10px; border-radius: 6px; border: 1px solid #334155; }
      .status:empty { display: none; }
      .hint { position: absolute; bottom: 16px; right: 16px; color: #94a3b8; font-size: 12px; background: rgba(15,23,42,0.75); padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; max-width: 220px; line-height: 1.4; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/",
          "cannon-es": "./vendor/cannon-es.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="wavedash-target"></canvas>
    <div class="ui top">
      <button class="btn primary" id="save-btn">Save</button>
      <button class="btn" id="load-btn">Load</button>
      <button class="btn" id="clear-btn">Clear scene</button>
      <div class="status" id="status"></div>
    </div>
    <div class="ui palette" id="palette"></div>
    <div class="hint">
      <b>Click</b> ground to drop an object.<br>
      <b>Shift+click</b> an object to remove it.<br>
      <b>Drag</b> to orbit, <b>scroll</b> to zoom.
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
